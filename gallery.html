<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14181F">
  <meta name="description" content="Ethan Wing — photo gallery.">
  <title>Gallery — Ethan Wing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* ---- Gallery hero ---- */
    .gallery-hero{
      position: relative;
      isolation: isolate;
      text-align: center;
      padding: clamp(3rem, 9vw, 5rem) var(--gutter) clamp(2rem, 5vw, 3rem);
    }
    .gallery-hero::before{
      content: "";
      position: absolute; inset: 0; z-index: -1;
      background: radial-gradient(circle at 50% 0%, var(--amber-soft), transparent 60%);
    }
    .gallery-hero h1{
      font-family: var(--font-display);
      text-transform: uppercase;
      font-weight: 700;
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      letter-spacing: .01em;
      margin: 0 0 .6rem;
    }
    .gallery-hero p{
      font-family: var(--font-mono);
      font-size: clamp(.8rem, 2vw, .95rem);
      letter-spacing: .04em;
      color: var(--chalk-dim);
      margin: 0 auto;
      max-width: 32em;
    }

    /* ---- Loading / empty states ---- */
    .gallery-status{
      text-align: center;
      padding: 4rem var(--gutter);
      font-family: var(--font-mono);
      font-size: .85rem;
      color: var(--chalk-dim);
      letter-spacing: .04em;
    }
    .gallery-status svg{ display: block; margin: 0 auto 1rem; opacity: .35; }

    /* ---- Photo grid ---- */
    .gallery-grid{
      max-width: var(--container);
      margin: 0 auto;
      padding: clamp(1rem, 3vw, 2rem) var(--gutter) clamp(4rem, 8vw, 6rem);
      columns: 3 220px;
      column-gap: 1rem;
    }
    .photo-card{
      break-inside: avoid;
      margin-bottom: 1rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      cursor: zoom-in;
      position: relative;
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    .photo-card:hover{
      transform: translateY(-3px);
      border-color: var(--amber);
      box-shadow: 0 16px 40px -16px rgba(242, 169, 59, .3);
    }
    .photo-card:focus-visible{
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }
    .photo-card img{
      width: 100%;
      display: block;
    }
    .photo-card figcaption{
      padding: .65rem .9rem .75rem;
      font-family: var(--font-mono);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--chalk-dim);
    }
    .photo-card .photo-date{
      display: block;
      font-size: .65rem;
      color: var(--amber);
      margin-top: .25rem;
    }

    /* ---- Lightbox ---- */
    .lightbox{
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, .92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .lightbox.open{
      opacity: 1;
      pointer-events: all;
    }
    .lightbox-inner{
      position: relative;
      max-width: min(94vw, 1100px);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
    }
    .lightbox-inner img{
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--line);
    }
    .lightbox-caption{
      font-family: var(--font-mono);
      font-size: .8rem;
      letter-spacing: .06em;
      color: var(--chalk-dim);
      text-align: center;
    }
    .lightbox-date{
      color: var(--amber);
      margin-left: .6rem;
    }
    .lb-close{
      position: fixed;
      top: 1.25rem; right: 1.25rem;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--chalk);
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      transition: border-color .15s ease;
    }
    .lb-close:hover{ border-color: var(--amber); color: var(--amber); }
    .lb-prev, .lb-next{
      position: fixed;
      top: 50%; transform: translateY(-50%);
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--chalk);
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color .15s ease;
    }
    .lb-prev{ left: 1rem; }
    .lb-next{ right: 1rem; }
    .lb-prev:hover, .lb-next:hover{ border-color: var(--amber); color: var(--amber); }
    .lb-prev[hidden], .lb-next[hidden]{ display: none; }

    @media (prefers-reduced-motion: reduce){
      .photo-card, .lightbox{ transition: none; }
    }
    @media (max-width: 480px){
      .gallery-grid{ columns: 1; }
      .lb-prev{ left: .25rem; }
      .lb-next{ right: .25rem; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-nav">
    <a class="brand" href="https://ethanwing.me" aria-label="Back to home">EW</a>
    <nav aria-label="Primary">
      <a href="https://ethanwing.me">Home</a>
      <a href="/blog.html">Blog</a>
    </nav>
  </header>

  <main id="main">
    <section class="gallery-hero">
      <p class="eyebrow">Photos</p>
      <h1>Gallery</h1>
      <p>A collection of moments worth keeping.</p>
    </section>

    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 240 32"><line x1="0" y1="16" x2="92" y2="16"/><circle cx="120" cy="16" r="10"/><line x1="148" y1="16" x2="240" y2="16"/></svg>
    </div>

    <div id="gallery-root" role="region" aria-label="Photo gallery" aria-live="polite">
      <div class="gallery-status" id="gallery-loading">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Loading photos…
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lightbox-inner">
      <img id="lb-img" src="" alt="">
      <p class="lightbox-caption" id="lb-caption"></p>
    </div>
    <button class="lb-close" id="lb-close" aria-label="Close photo viewer">✕</button>
    <button class="lb-prev" id="lb-prev" aria-label="Previous photo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="lb-next" id="lb-next" aria-label="Next photo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-tag">Let's talk</p>
      <div class="contact-row">
        <button class="icon-btn" type="button" id="email-btn" aria-label="Email Ethan">
          <img src="/email-outline.svg" alt="">
        </button>
        <a class="icon-btn" href="https://github.com/EdoubleU" aria-label="Ethan's GitHub" target="_blank" rel="noopener">
          <img src="/github.svg" alt="">
        </a>
        <a class="text-link" href="/blog.html">Blog</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var MANIFEST = '/photos/manifest.json';
      var root    = document.getElementById('gallery-root');
      var photos  = [];
      var current = 0;

      // ---- Load manifest ----
      fetch(MANIFEST + '?_=' + Date.now())
        .then(function (r) {
          if (!r.ok) throw new Error('no manifest');
          return r.json();
        })
        .then(function (data) {
          photos = (data.photos || []).slice().reverse(); // newest first
          render();
        })
        .catch(function () {
          root.innerHTML =
            '<div class="gallery-status">' +
              '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
                '<rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>' +
                '<circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>' +
                '<path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
              '</svg>' +
              'No photos yet — check back soon.' +
            '</div>';
        });

      // ---- Render grid ----
      function render() {
        if (!photos.length) {
          root.innerHTML =
            '<div class="gallery-status">No photos yet — check back soon.</div>';
          return;
        }
        var grid = document.createElement('div');
        grid.className = 'gallery-grid';
        photos.forEach(function (photo, i) {
          var fig = document.createElement('figure');
          fig.className = 'photo-card';
          fig.setAttribute('tabindex', '0');
          fig.setAttribute('role', 'button');
          fig.setAttribute('aria-label', (photo.caption || 'Photo') + ' — click to view full size');
          fig.innerHTML =
            '<img src="' + ((photo.filename||'').startsWith('/') || (photo.filename||'').startsWith('http') ? photo.filename : '/photos/' + photo.filename) + '" alt="' + escHtml(photo.caption || '') + '" loading="lazy">' +
            (photo.caption || photo.date
              ? '<figcaption>' +
                  (photo.caption ? escHtml(photo.caption) : '') +
                  (photo.date ? '<span class="photo-date">' + photo.date + '</span>' : '') +
                '</figcaption>'
              : '');
          fig.addEventListener('click', function () { openLightbox(i); });
          fig.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); }
          });
          grid.appendChild(fig);
        });
        root.innerHTML = '';
        root.appendChild(grid);
      }

      // ---- Lightbox ----
      var lb      = document.getElementById('lightbox');
      var lbImg   = document.getElementById('lb-img');
      var lbCap   = document.getElementById('lb-caption');
      var lbClose = document.getElementById('lb-close');
      var lbPrev  = document.getElementById('lb-prev');
      var lbNext  = document.getElementById('lb-next');
      var lastFocus = null;

      function openLightbox(i) {
        current = i;
        lastFocus = document.activeElement;
        showPhoto();
        lb.classList.add('open');
        lbClose.focus();
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lb.classList.remove('open');
        document.body.style.overflow = '';
        if (lastFocus) lastFocus.focus();
      }

      function showPhoto() {
        var p = photos[current];
        lbImg.src = (p.filename.startsWith('/') || p.filename.startsWith('http')) ? p.filename : '/photos/' + p.filename;
        lbImg.alt = p.caption || '';
        var capText = p.caption ? escHtml(p.caption) : '';
        var dateText = p.date ? '<span class="lightbox-date">' + p.date + '</span>' : '';
        lbCap.innerHTML = capText + dateText;
        lbPrev.hidden = current === 0;
        lbNext.hidden = current === photos.length - 1;
      }

      lbClose.addEventListener('click', closeLightbox);
      lb.addEventListener('click', function (e) {
        if (e.target === lb) closeLightbox();
      });
      lbPrev.addEventListener('click', function () {
        if (current > 0) { current--; showPhoto(); }
      });
      lbNext.addEventListener('click', function () {
        if (current < photos.length - 1) { current++; showPhoto(); }
      });
      document.addEventListener('keydown', function (e) {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape')      closeLightbox();
        if (e.key === 'ArrowLeft'  && current > 0)                 { current--; showPhoto(); }
        if (e.key === 'ArrowRight' && current < photos.length - 1) { current++; showPhoto(); }
      });

      // ---- Email ----
      var emailBtn = document.getElementById('email-btn');
      if (emailBtn) {
        emailBtn.addEventListener('click', function () {
          window.location.href = 'mailto:' + atob('ZXRoYW53aW5nQHByb3Rvbi5tZQ==');
        });
      }

      function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
    })();
  </script>
</body>
</html>
