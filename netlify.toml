# Netlify build configuration
# Runs node build.js before every deploy so posts/index.json
# is always regenerated from the current posts/*.md files.

[build]
  command = "node build.js"
  publish = "."

# Allows Netlify's own managed edge functions (like ua_blocker_ef)
# to resolve npm packages in the Deno edge runtime.
# Without this, @netlify/blobs fails to bundle and the deploy errors.
[build.environment]
  DENO_UNSTABLE_NPM = "1"
